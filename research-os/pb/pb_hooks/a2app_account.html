<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agents</title>
<!--
  The account page of an app built on the marketplace kit (SYSTEM-OWNED; served
  at /_a2app/account by _a2app_agents.js). A person approves an agent's sign-in
  here (#approve/<code>) and sees and revokes their agents (home). It uses the
  app's own sign-in: the PocketBase token the app keeps in this browser
  (localStorage "pocketbase_auth", the PocketBase SDK's default), sent as
  Authorization, so an approved agent acts as the person who approved it.
-->
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1d1d21; --muted: #62636b; --line: #e2e2e6;
    --accent: #3d5afe; --accent-text: #ffffff; --danger: #c62828; --warn-bg: #fff6e5; --warn-line: #f0c36d;
    --code-bg: #f0f1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --card: #1d1d22; --text: #ececf1; --muted: #a0a1ab; --line: #2e2e35;
      --accent: #7b8cff; --accent-text: #0f0f12; --danger: #ef7070; --warn-bg: #2b2414; --warn-line: #6b5420;
      --code-bg: #26262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  dl { margin: 0 0 16px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 13px; }
  .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 16px 0; }
  label.check { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 4px; cursor: pointer; }
  label.check input { margin-top: 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button, a.button { font: inherit; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  .code { font: 600 28px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; background: var(--code-bg); border-radius: 8px; padding: 14px; text-align: center; margin: 12px 0; user-select: all; }
  ul.agents { list-style: none; margin: 0; padding: 0; }
  ul.agents li { border-top: 1px solid var(--line); padding: 12px 0; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  ul.agents li:first-child { border-top: 0; padding-top: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .error { color: var(--danger); }
  form label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
  input[type=email], input[type=password] { width: 100%; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Agents</h1>
  <p class="sub" id="subtitle"></p>
  <div id="view"><div class="card"><p class="note">Loading…</p></div></div>
</main>
<script>
(function () {
  "use strict";
  var AUTH_KEY = "pocketbase_auth";
  var app = { name: "this app", authMode: "none" };
  var view = document.getElementById("view");

  function token() {
    try {
      var raw = window.localStorage.getItem(AUTH_KEY);
      if (!raw) return "";
      var stored = JSON.parse(raw);
      return stored && typeof stored.token === "string" ? stored.token : "";
    } catch (_e) {
      return "";
    }
  }

  function api(method, path, body) {
    var headers = { Accept: "application/json" };
    var t = token();
    if (t) headers.Authorization = t;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    return fetch(path, { method: method, headers: headers, credentials: "same-origin", body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (res) {
        return res.json().then(function (json) { return { ok: res.ok, status: res.status, json: json || {} }; }, function () { return { ok: res.ok, status: res.status, json: {} }; });
      }, function () {
        return { ok: false, status: 0, json: { message: "The app did not answer. Check your connection and try again." } };
      });
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  // A confirmation code is shown once, and only this tab keeps it, until the
  // request it belongs to expires: a reload or a Back in a browser that opened
  // this page in place of the agent's own must not lose it.
  function keptKey(code) {
    return "a2app.confirmation." + String(code).toUpperCase().replace(/[^A-Z0-9]/g, "");
  }
  function keep(code, value) {
    try { window.sessionStorage.setItem(keptKey(code), JSON.stringify(value)); } catch (_e) { /* not kept */ }
  }
  function kept(code) {
    try {
      var v = JSON.parse(window.sessionStorage.getItem(keptKey(code)) || "null");
      return v && typeof v.confirmation === "string" && Date.parse(v.expiresAt) > Date.now() ? v : null;
    } catch (_e) {
      return null;
    }
  }
  function forget(code) {
    try { window.sessionStorage.removeItem(keptKey(code)); } catch (_e) { /* nothing kept */ }
  }

  function show() {
    view.innerHTML = "";
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) view.appendChild(arguments[i]);
  }

  function ago(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return new Date(t).toLocaleString();
  }

  /** How long the access it asks for lasts, from seconds. */
  function lasting(seconds) {
    var s = Number(seconds);
    if (!(s > 0)) return "";
    if (s >= 86400) { var d = Math.round(s / 86400); return d + (d === 1 ? " day" : " days"); }
    if (s >= 3600) { var h = Math.round(s / 3600); return h + (h === 1 ? " hour" : " hours"); }
    return Math.max(1, Math.round(s / 60)) + " min";
  }

  function day(iso) {
    var t = Date.parse(iso);
    return isNaN(t) ? "" : new Date(t).toLocaleDateString();
  }

  function message(r, fallback) {
    return (r && r.json && r.json.message) || fallback;
  }

  function signIn(why) {
    var lead = el("p", { text: why || ("Sign in to " + app.name + " first. An agent you approve acts as you, with no more access than you have.") });
    var elsewhere = el("div", { "class": "row" }, [
      el("a", { "class": "button", href: "/", target: "_blank", rel: "noopener", text: "Open " + app.name }),
      el("button", { type: "button", text: "I've signed in", onclick: function () { route(); } }),
    ]);
    if (app.authMode !== "multi-user") {
      return show(el("div", { "class": "card" }, [lead, el("p", { "class": "note", text: "After signing in, come back to this page: " + window.location.href }), elsewhere]));
    }
    // Signed in right here, with the app's own accounts (the same sign-in the
    // app's page keeps), so the person never has to leave this page.
    var email = el("input", { type: "email", id: "a2a-email", autocomplete: "username", required: "required" });
    var password = el("input", { type: "password", id: "a2a-password", autocomplete: "current-password", required: "required" });
    var status = el("p", { "class": "error", role: "alert" });
    var go = el("button", { type: "submit", "class": "primary", text: "Sign in" });
    var form = el("form", {}, [
      el("label", { "for": "a2a-email", text: "Email" }), email,
      el("label", { "for": "a2a-password", text: "Password" }), password,
      status,
      el("div", { "class": "row" }, [go]),
    ]);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      go.disabled = true;
      status.textContent = "";
      api("POST", "/api/collections/users/auth-with-password", { identity: email.value.trim(), password: password.value }).then(function (r) {
        go.disabled = false;
        if (r.ok && r.json && typeof r.json.token === "string") {
          password.value = "";
          try { window.localStorage.setItem(AUTH_KEY, JSON.stringify({ token: r.json.token, record: r.json.record || null })); } catch (_e) { /* signed in for this load only */ }
          return route();
        }
        status.textContent = r.status === 429 ? "Too many tries. Wait a minute, then try again." : message(r, "That email and password didn't work.");
      });
    });
    show(el("div", { "class": "card" }, [lead, form, el("p", { "class": "note", text: "Or sign in on " + app.name + " itself, then come back here." }), elsewhere]));
  }

  function failed(text) {
    show(el("div", { "class": "card" }, [el("p", { "class": "error", text: text })]));
  }

  function approve(code) {
    document.getElementById("title").textContent = "Let an agent use " + app.name + "?";
    api("GET", "/api/_a2app/auth/device/" + encodeURIComponent(code)).then(function (r) {
      if (r.status === 401) return signIn();
      if (r.status === 409 && r.json.code === "already_approved") {
        var held = kept(code);
        if (held) return approved({ userCode: code, agentName: held.agentName, expiresAt: held.expiresAt }, { confirmation: held.confirmation });
        return failed("You already approved this request, and " + (r.json.agentName || "your agent") + " is waiting for its confirmation code. This page showed it once and no longer has it: start connecting again from your agent.");
      }
      if (r.status === 404) {
        forget(code);
        return failed("No sign-in request is waiting for the code " + code + ". It may have finished, expired or been declined. If your agent still asks for a code, start connecting again from your agent.");
      }
      if (!r.ok) return failed(message(r, "Couldn't load this request."));
      var q = r.json;
      var reads = Array.isArray(q.readScopes) ? q.readScopes : [];
      var readOnly = el("input", { type: "checkbox" });
      readOnly.checked = reads.length > 0;
      if (reads.length === 0) readOnly.disabled = true;
      var scopeNote = el("p", { "class": "note" });
      function describeAccess() {
        scopeNote.textContent = readOnly.checked
          ? "It can look at what you can see in " + app.name + ", but not change anything."
          : "It can do everything you can do in " + app.name + ", including changes.";
      }
      readOnly.addEventListener("change", describeAccess);
      describeAccess();
      var status = el("p", { "class": "error", role: "alert" });
      var yes = el("button", { type: "button", "class": "primary", text: "Approve" });
      var no = el("button", { type: "button", text: "Deny" });
      function decide(ok) {
        yes.disabled = no.disabled = true;
        status.textContent = "";
        var body = { approve: ok };
        if (ok && readOnly.checked) body.scopes = reads;
        api("POST", "/api/_a2app/auth/device/" + encodeURIComponent(code), body).then(function (d) {
          if (!d.ok) {
            yes.disabled = no.disabled = false;
            status.textContent = d.status === 401 ? "Your sign-in to " + app.name + " has ended. Sign in again, then retry." : message(d, "That didn't work. Try again.");
            return;
          }
          if (!ok) return show(el("div", { "class": "card" }, [el("p", { text: "Declined. The agent won't get access." })]));
          approved(q, d.json);
        });
      }
      yes.addEventListener("click", function () { decide(true); });
      no.addEventListener("click", function () { decide(false); });
      show(el("div", { "class": "card" }, [
        el("dl", {}, [
          el("dt", { text: "Agent" }), el("dd", { "class": "name", text: q.agentName }),
          el("dt", { text: "Asked" }), el("dd", { text: ago(q.requestedAt) }),
          el("dt", { text: "Acts as" }), el("dd", { text: (q.approver && q.approver.name) || "you" }),
          el("dt", { text: "For" }), el("dd", { text: lasting(q.expiresIn) }),
          el("dt", { text: "Request code" }), el("dd", { "class": "name", text: q.userCode }),
        ]),
        el("p", { "class": "note", text: q.loopback
          ? "The agent is waiting on this computer: approving hands it the confirmation code."
          : "After you approve, this page shows a confirmation code: copy it, go back to " + q.agentName + " and enter it there." }),
        el("label", { "class": "check" }, [readOnly, el("span", { text: "Only let it read" })]),
        scopeNote,
        el("div", { "class": "warn", text: "Check that " + q.agentName + " shows the same request code, " + q.userCode + ". If it doesn't, or you didn't just connect an agent, choose Deny: someone else's request would get your access. The agent's name is whatever the requester typed." }),
        status,
        el("div", { "class": "row" }, [yes, no]),
      ]));
    });
  }

  function approved(q, d) {
    document.getElementById("title").textContent = "Approved";
    if (!d.redirect) keep(q.userCode, { confirmation: d.confirmation, agentName: q.agentName || null, expiresAt: q.expiresAt });
    var parts = [
      el("p", { text: "Approved. Copy this confirmation code, then go back to " + (q.agentName || "your agent") + " and enter it there:" }),
      el("div", { "class": "code", text: d.confirmation }),
      el("p", { "class": "note", text: "It works once, for this request only, until the request expires. Never give it to a website or another person. If you come back to this page in this tab, it shows the code again." }),
    ];
    var copy = el("button", { type: "button", text: "Copy code" });
    copy.addEventListener("click", function () {
      try {
        navigator.clipboard.writeText(d.confirmation).then(function () { copy.textContent = "Copied"; });
      } catch (_e) { /* select it by hand */ }
    });
    parts.push(el("div", { "class": "row" }, [copy, el("a", { "class": "button", href: "#", text: "See your agents" })]));
    show(el("div", { "class": "card" }, parts));
    // The code goes only where the person puts it (this page is never framed),
    // or to an agent waiting on this computer, which takes it itself.
    if (d.redirect) window.location.assign(d.redirect);
  }

  function home() {
    document.getElementById("title").textContent = "Your agents in " + app.name;
    api("GET", "/api/_a2app/credentials").then(function (r) {
      if (r.status === 401) return signIn("Sign in to " + app.name + " to see the agents you've connected.");
      if (!r.ok) return failed(message(r, "Couldn't load your agents."));
      var who = r.json.signedInAs && r.json.signedInAs.name;
      document.getElementById("subtitle").textContent = who ? "Signed in as " + who + "." : "";
      var list = Array.isArray(r.json.credentials) ? r.json.credentials : [];
      if (list.length === 0) {
        return show(el("div", { "class": "card" }, [
          el("p", { text: "No agents are connected." }),
          el("p", { "class": "note", text: "To connect one, start the sign-in from your agent. It shows you a link to approve here." }),
        ]));
      }
      var items = list.map(function (c) {
        var revoke = el("button", { type: "button", "class": "danger", text: "Revoke" });
        revoke.addEventListener("click", function () {
          revoke.disabled = true;
          api("DELETE", "/api/_a2app/credentials/" + encodeURIComponent(c.credentialId)).then(function (d) {
            if (d.ok) return home();
            revoke.disabled = false;
            window.alert(message(d, "Couldn't revoke it."));
          });
        });
        return el("li", {}, [
          el("div", {}, [
            el("div", { "class": "name", text: c.agentName || "Agent" }),
            el("div", { "class": "note", text: (c.readOnly ? "Read only" : "Everything you can do") + " · connected " + day(c.createdAt) + (c.expiresAt ? " · until " + day(c.expiresAt) : "") }),
          ]),
          revoke,
        ]);
      });
      show(el("div", { "class": "card" }, [el("ul", { "class": "agents" }, items)]));
    });
  }

  function route() {
    var hash = window.location.hash.replace(/^#/, "");
    var m = /^approve\/(.+)$/.exec(hash);
    document.getElementById("subtitle").textContent = "";
    if (m) return approve(decodeURIComponent(m[1]));
    if (hash === "approve") return failed("Open the full link your agent showed you: it ends with the request's code.");
    return home();
  }

  window.addEventListener("hashchange", route);
  api("GET", "/api/_a2app").then(function (r) {
    if (r.ok && r.json && r.json.app) {
      app.name = r.json.app.name || r.json.app.id || app.name;
      app.authMode = r.json.authMode || app.authMode;
      document.title = "Agents · " + app.name;
    }
    route();
  });
})();
</script>
</body>
</html>
